# Como se publica la web en Cloudflare.
# El worker sirve los ficheros del sitio y ademas atiende /auth y
# /callback, que son los que dejan entrar al panel de edicion.

name = "dsl"
main = "worker/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./"
binding = "ASSETS"

# El identificador de la aplicacion de GitHub no es secreto, de hecho
# viaja a la vista en la direccion de autorizacion. Va aqui a proposito,
# para que no se pierda en cada despliegue.
# La clave, GITHUB_CLIENT_SECRET, NO va aqui. Esa se guarda como secreto
# en el panel de Cloudflare y sobrevive a los despliegues.
[vars]
GITHUB_CLIENT_ID = "Ov23liZgmDtaRLewLRNN"
ORIGENES = "https://dsl.dsl770.workers.dev"
